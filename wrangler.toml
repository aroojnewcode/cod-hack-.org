# Cloudflare Workers + static assets — required so CI `npx wrangler deploy` succeeds.
# (Dashboard is locked to that command; `wrangler pages deploy` is not used.)
name = "codhack"
main = "workers/site.js"
compatibility_date = "2026-09-12"

# Cloudflare CI is locked to `npx wrangler deploy` with no separate build step.
# Wrangler must install deps and produce ./dist before it looks for static assets.
[build]
command = "npm ci --include=dev && npm run build"

[[routes]]
pattern = "codhack.org"
custom_domain = true

[[routes]]
pattern = "www.codhack.org"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
run_worker_first = [
  "/*",
  "!/sitemap.xml",
  "!/robots.txt",
  "!/sitemap.css",
  "!/favicon.svg",
  "!/_astro/*",
  "!/media/*",
  "!/videos/*",
  "!/og/*",
]
